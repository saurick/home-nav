name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/docker-publish.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "config.example.yaml"
      - "cmd/**"
      - "internal/**"
      - "deploy/docker-compose.hub.yml"
      - "deploy/smoke-docker.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  GIT_OPTIONAL_LOCKS: "0"

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release settings
        if: github.event_name == 'push'
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "只发布 v主版本.次版本.修订号 格式的稳定版本"; exit 1; }
          [[ "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]] || { echo "请设置 DOCKERHUB_IMAGE，例如 yourname/home-nav，不带版本标签"; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "请设置 DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "请设置 DOCKERHUB_TOKEN secret"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Test application
        run: |
          go test ./...
          node --test internal/server/web/*.test.cjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: home-nav:smoke-amd64

      - name: Smoke test amd64 image
        run: python3 -B deploy/smoke-docker.py --image home-nav:smoke-amd64 --platform linux/amd64

      - name: Build arm64 smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: home-nav:smoke-arm64

      - name: Smoke test arm64 image
        run: python3 -B deploy/smoke-docker.py --image home-nav:smoke-arm64 --platform linux/arm64

      - name: Image tags and labels
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform image
        if: github.event_name == 'push'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record published image
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Image: %s@%s\n\nCommit: %s\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

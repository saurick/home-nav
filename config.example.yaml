title: Home
subtitle: 只读入口页，服务状态由后台定时缓存
check_interval: 30s

# 用稳定域名标识与导航部署在同一台服务器的入口。
# internal_url 使用这个域名时，内网访问会跟随浏览器当前打开导航的主机地址。
access:
  home_host: home-lan.example.test
  # 省略 default_ports 表示不限端口；空列表表示都不可直连。
  default_ports: [5001, 8080]
  # 可按网络覆盖默认端口，最长前缀优先；具体 IP 变化不需要更新这里。
  network_ports:
    "100.64.0.0/10": [5001, 8080, 8090]

auth:
  # 保持下面的示例账号、密码和 session_secret 时，首次打开会进入 /setup。
  # 真实运行配置请使用私有 services.yaml，不要提交真实密码。
  enabled: false
  username: admin
  password: change-me
  session_secret: change-this-to-at-least-32-random-characters

assets:
  uploads_dir: ""
  uploads_url_prefix: /uploads/
  icon_cache_dir: ""

appearance:
  background_color: "#000000"
  background_image: ""
  background_overlay: "medium"

groups:
  - id: ops
    name: 运维工具
    services:
      - id: dockge
        name: Dockge
        # true 时显示在常用入口；省略或 false 时显示在所属分组。
        pinned: false
        description: Docker Compose 管理入口，只提供跳转链接
        icon_text: D
        internal_url: http://home-lan.example.test:5001
        internal_domain_url: https://dockge-lan.example.test
        external_url: https://dockge.example.com
        tags:
          - docker
          - ops
        health:
          type: http
          url: http://home-lan.example.test:5001
          expect_status: 200
          timeout: 2s

      - id: ssh-gateway
        name: SSH 网关
        description: 内网维护入口示例
        icon_text: SSH
        internal_url: http://gateway.example.local
        external_url: ""
        tags:
          - ops
          - tcp
        notes: TCP 检查只判断端口是否可连接，不执行登录。
        health:
          type: tcp
          address: gateway.example.local:22
          timeout: 2s

  - id: tools
    name: 开发工具
    services:
      - id: drawio
        name: Draw.io
        description: 图表绘制工具
        icon_text: DI
        internal_url: http://drawio.example.local
        external_url: https://drawio.example.com
        tags:
          - diagram
          - tools
        notes: 外部服务或不需要探测的入口可以禁用健康检查。
        health:
          type: disabled
